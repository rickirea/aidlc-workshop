<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Kiro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <h1>Flappy Kiro</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="controls">
      <button id="playButton" class="game-button">PLAY</button>
      <button id="restartButton" class="game-button" style="display: none;">RESTART</button>
    </div>
    
    <div class="instructions">
      <p>Press <strong>SPACEBAR</strong> to make Ghosty jump</p>
      <p>Press <strong>X</strong> to shoot plasma (1 shot per 5 points)</p>
      <p>Collect coins for bonus points!</p>
    </div>
  </div>
  
  <script type="module" src="src/main.js"></script>
</body>
</html>
